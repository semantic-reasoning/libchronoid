name: CI Main

# Non-blocking comprehensive monitoring on main pushes. Same matrix
# as ci-pr.yml plus an ARM64 lane that exercises the NEON SIMD path
# (since x86_64 hosts only build the SSE2 kernel). Every job runs to
# completion; failures show up in the step summary but never block.
#
# Phases:
#   Phase 1 (Lint):       lint-main.yml — gst-indent + clang-tidy
#   Phase 2 (Build/Test): Linux GCC + Clang, macOS, Windows MSVC + clang-cl, ARM64 GCC
#   Phase 3 (Sanitizers): Linux + macOS ASan + UBSan
#   Phase 4 (Footprint):  size table for the stripped library

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Phase 1: Lint monitoring
  # ==========================================================================
  lint:
    uses: ./.github/workflows/lint-main.yml

  # ==========================================================================
  # Phase 2: Build & Test (parallel, non-blocking)
  # Adds ARM64 (ubuntu-24.04-arm) so the NEON SIMD path actually
  # gets exercised under CI; x86_64 lanes only build the SSE2 kernel.
  # ==========================================================================
  build:
    name: Build / ${{ matrix.os_display || matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cc: clang
          - os: macos-latest
            compiler: clang
            cc: clang
          - os: windows-latest
            compiler: msvc
            cc: cl
          # Mirror the PR-gate clang-cl lane (issue #12) so any
          # post-merge regression in the SSSE3 / AVX2 target-feature
          # gating surfaces on main even if the PR gate was bypassed
          # or its image diverged. continue-on-error stays true.
          - os: windows-latest
            compiler: clang-cl
            cc: clang-cl
          # GitHub-hosted ARM64 runner exercises the NEON SIMD path.
          - os: ubuntu-24.04-arm
            os_display: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux + ARM64)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi
          # ARM64 sanity: confirm /proc/cpuinfo advertises the SIMD ISA
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            grep -q 'asimd\|neon' /proc/cpuinfo \
              && echo "ARM64 NEON / asimd advertised" \
              || echo "::warning::ARM64 NEON not detected"
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install meson ninja

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir
        env:
          CC: ${{ matrix.cc }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\activate-msvc.cmd
          set CC=${{ matrix.cc }}
          meson setup builddir

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\activate-msvc.cmd
          set CC=${{ matrix.cc }}
          meson compile -C builddir

      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --print-errorlogs

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\activate-msvc.cmd
          set CC=${{ matrix.cc }}
          meson test -C builddir --print-errorlogs

      - name: Footprint
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        continue-on-error: true
        run: |
          rm -rf build-rel
          meson setup build-rel --buildtype=release
          meson compile -C build-rel

          mapfile -t release_shared < <(find build-rel -maxdepth 1 -type f \
            -name 'libchronoid.so.*' -print)
          if [ "${#release_shared[@]}" -ne 1 ]; then
            echo "Expected one versioned shared library." >&2
            exit 1
          fi

          strip --strip-unneeded "${release_shared[0]}"

          {
            echo '## Standard O3 footprint — ${{ matrix.os }} / GCC / ${{ runner.arch }}'
            echo ''
            echo 'Shared libraries are stripped with `strip --strip-unneeded`;'
            echo 'the static archive and CLI are measured as built.'
            echo ''
            echo '| Artifact | Bytes |'
            echo '|---|---:|'
            for spec in \
                "shared:${release_shared[0]}" \
                'static:build-rel/libchronoid.a' \
                'chronoid-gen:build-rel/chronoid-gen'; do
              IFS=: read -r label artifact_path <<< "$spec"
              if [ ! -f "$artifact_path" ]; then
                echo "Missing footprint artifact for $label." >&2
                exit 1
              fi
              artifact_bytes=$(stat -c '%s' "$artifact_path")
              case "$artifact_bytes" in
                *[!0-9]*|'')
                  echo "Invalid footprint size for $label." >&2
                  exit 1
                  ;;
              esac
              printf '| %s | %s |\n' "$label" "$artifact_bytes"
            done
            echo ''
            echo '<details><summary>Shared-library sections</summary>'
            echo ''
            echo '```text'
            size -A "${release_shared[0]}"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results
        if: always()
        shell: bash
        run: |
          echo "## Build Results: ${{ matrix.os_display || matrix.os }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${{ job.status }}** (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 2b: Scalar fallback monitoring (issue #6)
  # Mirrors the blocking PR-gate jobs in ci-pr.yml's `scalar-fallback`
  # matrix. Adds a Clang variant per lane so a Clang-specific scalar
  # codegen regression that GCC would not catch surfaces here. Runs
  # non-blocking; the PR-gate enforces correctness, this lane provides
  # compiler diversity.
  # ==========================================================================
  scalar-fallback:
    name: Scalar fallback / ${{ matrix.lane }} / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        lane: [no-avx2, no-ssse3, force-scalar]
        include:
          - lane: no-avx2
            setup_args: -Davx2_batch=disabled
            test_env: ''
          - lane: no-ssse3
            setup_args: -Dssse3=disabled -Davx2_batch=disabled
            test_env: ''
          - lane: force-scalar
            setup_args: ''
            test_env: CHRONOID_FORCE_SCALAR=1
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure (${{ matrix.lane }})
        run: meson setup builddir-${{ matrix.lane }} ${{ matrix.setup_args }}
        env:
          CC: ${{ matrix.compiler }}

      - name: Build
        run: meson compile -C builddir-${{ matrix.lane }}

      - name: Test
        run: |
          if [ -n "${{ matrix.test_env }}" ]; then
            env ${{ matrix.test_env }} meson test -C builddir-${{ matrix.lane }} --print-errorlogs
          else
            meson test -C builddir-${{ matrix.lane }} --print-errorlogs
          fi

      - name: Publish results
        if: always()
        run: |
          echo "## Scalar Fallback: ${{ matrix.lane }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${{ job.status }}** (non-blocking)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 3: Sanitizers (ASan + UBSan, non-blocking)
  # ==========================================================================
  sanitizers:
    name: Sanitizers / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cc: clang
          - os: macos-latest
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: Configure with sanitizers
        run: >
          meson setup builddir-san
          -Db_sanitize=address,undefined
          -Db_lundef=false
          --buildtype=debug
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: meson compile -C builddir-san

      - name: Test
        run: meson test -C builddir-san --print-errorlogs
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1

      - name: Publish results
        if: always()
        run: |
          echo "## Sanitizer Results: ${{ matrix.os }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Status: **${{ job.status }}** (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
